<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0403" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>RaabtaLink</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>RaabtaLink</h1>
        <p id="connectionStatus" class="net-pill" data-state="checking">Checking</p>
      </header>

      <!-- GPS Panel -->
      <section class="panel gps-panel">
        <div class="panel-label">📍 Location</div>
        <p id="gpsStatus" class="gps-status" data-state="pending">Getting location…</p>
        <p id="gpsCoords" class="gps-coords" hidden></p>
        <p id="gpsSource" class="gps-source" hidden></p>
        <div class="gps-actions">
          <button id="retryGps" class="btn btn-sm" type="button" hidden>Retry GPS</button>
          <button id="pickLocation" class="btn btn-sm" type="button">Pick manually</button>
        </div>
        <div id="locationPicker" class="location-picker" hidden>
          <p class="picker-label">Select your area:</p>
          <div id="locationGrid" class="location-grid"></div>
        </div>
      </section>

      <!-- People -->
      <section class="panel people-panel">
        <div class="panel-label">👥 People</div>
        <div class="stepper">
          <button id="peopleMinus" class="stepper-btn" type="button">−</button>
          <span id="peopleCount" class="stepper-value">1</span>
          <button id="peoplePlus" class="stepper-btn" type="button">+</button>
        </div>
      </section>

      <!-- Live Transcribe -->
      <section class="panel live-panel">
        <div class="panel-label">🎙️ Live Transcription</div>
        <button id="liveBtn" class="btn live-btn" type="button">Start Live Transcribe</button>
        <div id="liveTranscript" class="live-transcript" hidden>
          <div id="liveTranscriptText" class="live-transcript-text"></div>
          <div id="liveServerMsgs" class="live-server-msgs"></div>
        </div>
      </section>

      <!-- Status -->
      <p id="appStatus" class="app-status">Ready</p>

      <!-- Healthcare Responder Auth -->
      <section class="panel auth-panel">
        <div class="panel-label">🏥 Healthcare Responder</div>

        <!-- Logged-in profile (shown when authenticated) -->
        <div id="responderProfile" class="responder-profile" hidden>
          <p id="responderName" class="responder-name"></p>
          <p id="responderOrg" class="responder-org"></p>
          <p id="responderRole" class="responder-role"></p>
          <button id="logoutBtn" class="btn btn-sm" type="button">Logout</button>
        </div>

        <!-- Auth forms (shown when not authenticated) -->
        <div id="authForms">
          <div class="auth-tabs">
            <button id="tabLogin" class="auth-tab is-active" type="button">Login</button>
            <button id="tabRegister" class="auth-tab" type="button">Register</button>
          </div>

          <!-- Login form -->
          <form id="loginForm" class="auth-form">
            <input id="loginUser" class="auth-input" type="text" placeholder="Username" required />
            <input id="loginPass" class="auth-input" type="password" placeholder="Password" required />
            <button class="btn auth-submit" type="submit">Login</button>
          </form>

          <!-- Register form -->
          <form id="registerForm" class="auth-form" hidden>
            <input id="regUser" class="auth-input" type="text" placeholder="Username" required />
            <input id="regEmail" class="auth-input" type="email" placeholder="Email" required />
            <input id="regPass" class="auth-input" type="password" placeholder="Password" required />
            <input id="regName" class="auth-input" type="text" placeholder="Full Name" required />
            <input id="regOrg" class="auth-input" type="text" placeholder="Organization (hospital, NGO)" required />
            <input id="regLicense" class="auth-input" type="text" placeholder="License ID (optional)" />
            <button class="btn auth-submit" type="submit">Register</button>
          </form>

          <p id="authMsg" class="auth-msg"></p>
        </div>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
